[package]
name = "wisent-errors"
version = "1.0.0"
edition = "2021"
description = "The Wisent failure envelope: one vocabulary, one shape, one place to look it up."
license = "Apache-2.0"
repository = "https://github.com/wisent-ai/wisent-errors"

# No dependencies by default. A package every product has to adopt must be
# cheap to adopt, and a serde requirement is a reason to keep the local copy.
# The `cli-output` feature brings serde for the CLIs that print JSON and
# `path: value` text through `cli_output`; nothing else pays for it.
[features]
cli-output = ["dep:serde", "dep:serde_json"]
# Failures and usage from an installed copy, sent to Echo's app collector with
# the user's consent (docs/telemetry.md). Only a product that ships to people
# outside the fleet needs it, so only it pays for an HTTP client. Each send to
# the collector is a wait through stado-wait (in its register, said on stderr,
# measured; ended by the collector's answer or close, never a guessed time),
# and the moment of the last delivery is written in local time with its
# offset through chrono, the clock stado-wait already links.
telemetry = ["dep:serde_json", "dep:ureq", "dep:getrandom", "dep:stado-wait", "dep:chrono"]
# `<product> doctor`: every functionality of the product's catalogue tried now
# (docs/diagnosis.md).
diagnosis = ["dep:serde_json"]

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "2.12", optional = true }
getrandom = { version = "0.2", optional = true }
# 0.2.0, as the fleet declares it (`stado quality check` refuses an earlier
# one). Neither of its clients (`http`, `async`): the send is ureq's, waited
# on as blocking work. stado-wait depends on no wisent-errors, and Stado's own
# dependency on this crate takes no `telemetry`, so there is no cycle.
stado-wait = { git = "https://github.com/wisent-ai/stado", package = "stado-wait", version = "0.2.0", default-features = false, optional = true }
chrono = { version = "0.4", optional = true }

# The tests of `cli_output`, `telemetry` and `diagnosis` run in every `cargo
# test`: the crate depends on itself with those features on, so no test target
# is skipped for a feature nobody turned on. serde_json decodes the documents
# those tests read.
[dev-dependencies]
wisent-errors = { path = ".", features = ["cli-output", "telemetry", "diagnosis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The telemetry tests read the moment of the last delivery back as an instant
# and compare its offset with this host's.
chrono = "0.4"

# The fleet's tests live under tests/<area>/ at the repository root.
[[test]]
name = "warnings"
path = "../tests/warnings/declaration.rs"

[[test]]
name = "declaration"
path = "../tests/declaration/placeholders.rs"

[[test]]
name = "envelope"
path = "../tests/envelope/build.rs"

[[test]]
name = "declared"
path = "../tests/declared/raise.rs"

[[test]]
name = "cli-output-read"
path = "../tests/cli-output/read_json.rs"

[[test]]
name = "cli-output-print"
path = "../tests/cli-output/print.rs"

[[test]]
name = "telemetry"
path = "../tests/telemetry/main.rs"
required-features = ["telemetry"]

[[test]]
name = "diagnosis"
path = "../tests/diagnosis/main.rs"
required-features = ["diagnosis"]
